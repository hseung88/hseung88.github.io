    Research:
      - company: University of Wisconsin--Madison
        position: Scalable Gaussian Processes with Derivatives
        location: Madison, WI
        start_date: 2025
        end_date: present
        summary: Postdoctoral research advised by Matthias Katzfuss.
        highlights:
          - Developed a target-specific gradient reduction framework for derivative Gaussian processes, enabling scalable function-value prediction from gradient observations while preserving the exact gradient information required by each Vecchia predictive factor.

      - company: University of Georgia
        position: Curvature-Aware Optimization for Deep Learning
        location: Athens, GA
        start_date: 2022
        end_date: 2025
        summary: Research advised by Jaewoo Lee.
        highlights:
          - Developed a curvature-aware zeroth-order optimizer for LLM fine-tuning, improving convergence and test accuracy over MeZO-Adam while reducing memory usage.
          - Developed scalable second-order optimization methods using activation covariance, improving vision transformer test accuracy over AdamW.

      - company: University of Wisconsin--Madison
        position: Hyperspectral Foundation Models
        location: Madison, WI
        start_date: 2025
        end_date: present
        summary: Collaboration with the Townsend Lab.
        highlights:
          - Developing hyperspectral foundation models by pre-training vision transformers on hyperspectral data and fine-tuning them for downstream trait prediction.

      - company: University of Georgia
        position: Time Series Forecasting
        location: Athens, GA
        start_date: 2021
        end_date: 2023
        summary: Research advised by Yuan Ke.
        highlights:
          - Developed hybrid COVID-19 mortality forecasting models using online autocovariance change point detection.

      - company: SK hynix Inc.
        position: Wafer Failure Early Detection System
        location: Seoul, South Korea
        start_date: 2018
        end_date: 2018
        highlights:
          - Identified key predictors of wafer failure using statistical models for high-dimensional semiconductor fabrication data.

      - company: Yonsei University
        position: Modified Likelihood Ratio Tests
        location: Seoul, South Korea
        start_date: 2017
        end_date: 2018
        summary: Research advised by Sangun Park.
        highlights:
          - Developed modified likelihood ratio test statistics tailored to highly skewed settings to improve sensitivity to tail departures.

    Software:
      - name: TERA
        summary: Scalable derivative Gaussian processes.
        highlights:
          - PyTorch implementation of target-specific gradient reduction for function-value prediction with gradient observations.
        start_date: 2026
        url: https://github.com/hseung88/tera

      - name: LOREN
        summary: Low-rank curvature for zeroth-order LLM fine-tuning.
        highlights:
          - PyTorch implementation of low-rank curvature-aware zeroth-order optimization for memory-efficient LLM fine-tuning.
        start_date: 2025
        url: https://github.com/hseung88/loren

      - name: MAC
        summary: Mean activation curvature for scalable second-order optimization.
        highlights:
          - PyTorch implementation of gradient preconditioning using mean activation curvature for training deep neural networks.
        start_date: 2025
        url: https://github.com/hseung88/mac

      - name: ACP
        summary: Enhancing COVID-19 mortality forecasting using change points.
        highlights:
          - PyTorch implementation of online autocovariance change point detection methods for COVID-19 mortality forecasting.
        start_date: 2025
        url: https://github.com/hseung88/acp

      - name: NysAct
        summary: Nyström activation covariance preconditioning.
        highlights:
          - PyTorch implementation of Nyström-approximated activation covariance preconditioning for scalable curvature-aware training.
        start_date: 2024
        url: https://github.com/hseung88/nysact

      - name: AdaAct
        summary: Adaptive activation stabilization for generalization.
        highlights:
          - PyTorch implementation of adaptive activation stabilization methods for improving generalization in deep neural networks.
        start_date: 2024
        url: https://github.com/hseung88/adaact

